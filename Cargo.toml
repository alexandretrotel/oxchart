[package]
name = "oxchart"
version = "0.1.0"
edition = "2024"
authors = ["Alexandre Trotel"]
license = "MIT"
description = "Fast module graph builder powered by oxc, with pluggable renderers like Mermaid."
keywords = ["oxc", "module-graph", "mermaid", "javascript", "typescript"]
categories = ["development-tools", "command-line-utilities"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "oxchart"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
globset = "0.4.20"
thiserror = "2.0.21"

anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
oxc_parser = "0.156.0"
oxc_allocator = "0.156.0"
oxc_span = "0.156.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"
oxc_diagnostics = "0.156.0"
oxc_resolver = "11.24.3"
rayon = "1.12.0"

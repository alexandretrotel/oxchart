[package]
name = "oxchart"
version = "0.1.0"
edition = "2024"
authors = ["Alexandre Trotel"]
license = "MIT"
description = "Fast module graph builder powered by oxc, with pluggable renderers like Mermaid."
keywords = ["oxc", "module-graph", "mermaid", "javascript", "typescript"]
categories = ["development-tools", "command-line-utilities"]

[features]
default = ["cli"]
cli = ["svg", "ascii", "png", "jpeg", "pdf", "dep:clap", "dep:anyhow", "dep:serde", "dep:toml", "dep:opener"]
svg = ["dep:merman", "merman/svg"]
ascii = ["dep:merman", "merman/ascii"]
png = ["svg", "merman/png"]
jpeg = ["svg", "merman/jpeg"]
pdf = ["svg", "merman/pdf"]

[[bin]]
name = "oxchart"
path = "src/bin/oxchart/main.rs"
required-features = ["cli"]

[dependencies]
globset = "0.4.20"
thiserror = "2.0.21"

anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
oxc_parser = "0.156.0"
oxc_allocator = "0.156.0"
oxc_span = "0.156.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"
oxc_diagnostics = "0.156.0"
oxc_resolver = "11.24.3"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"], optional = true }
toml = { version = "1.1.8", optional = true }
merman = { version = "0.9.2", default-features = false, features = ["diagram-flowchart"], optional = true }
opener = { version = "0.9.0", optional = true }
oxc_semantic = "0.156.0"
